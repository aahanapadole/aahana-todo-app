<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aahana's To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5e6ff;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 65%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        ul {
            text-align: left;
        }

        li {
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✨ Aahana's To-Do List</h1>

    <input id="taskInput" placeholder="Enter a task">

    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

</div>

<script>

function addTask() {

    let input = document.getElementById("taskInput");

    if (input.value.trim() === "") {
        return;
    }

    let li = document.createElement("li");

    li.innerHTML =
        input.value +
        ' <button onclick="this.parentElement.remove()">❌</button>';

    document.getElementById("taskList").appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
